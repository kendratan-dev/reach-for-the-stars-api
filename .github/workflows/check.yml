# CS 313 automatic check (Week 12 kit). Runs on GitHub after every push.
# DO NOT EDIT THIS FILE. The check compares it with the official copy, and
# changing the check is treated as an academic-integrity matter.
name: CS 313 check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    name: Hub Contract and set-up check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ci_game
      DB_USER: postgres
      DB_PASSWORD: postgres
      HUB_API_KEY: ci-check-hub-key
      JWT_SECRET: ci-check-jwt-secret-0123456789abcdef0123456789abcdef
      JWT_EXPIRES_IN: 1h
      CORS_ORIGINS: http://hub.cs313.test

    steps:
      - name: Get the code, with its full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use the official check from the class template
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TEMPLATE=$(gh api "repos/${{ github.repository }}" --jq '.template_repository.full_name // empty' || true)
          if [ -n "$TEMPLATE" ]; then
            curl -fsSL "https://raw.githubusercontent.com/$TEMPLATE/main/scripts/ci-check.js" -o scripts/ci-check.js
            echo "Using the official check from $TEMPLATE"
          else
            echo "::warning::This repository was not made from the class template. Its own copy of the check was used."
          fi

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the packages
        run: npm ci

      - name: Create the database
        run: npm run db:create

      - name: Run the CS 313 check (the scorecard is in the Summary tab)
        run: node scripts/ci-check.js
