# Render Blueprint: one free web service and one free PostgreSQL database.
# In the Render dashboard: New > Blueprint > this repository. Render reads this file.
# Change the two "name" values: they become part of your public address.
services:
  - type: web
    name: reach-for-the-stars-kendratan
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm run start:render
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: reach-for-the-stars-kendratan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      # Asked for once, when you create the Blueprint. Never written in this file.
      - key: HUB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_SCHOOL_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: reach-for-the-stars-kendratan-db
    plan: free
    region: singapore
    databaseName: reach_for_the_stars
    ipAllowList: []          # only services inside Render may connect
