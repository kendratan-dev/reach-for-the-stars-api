# Reach for the Stars API - OpenAPI Specification
openapi: 3.0.3
info:
  title: Reach for the Stars API
  version: 1.0.0
  description: >
    Reach for the Stars is an interactive trivia and question-set game platform where hosts create and manage question sets, 
    players join game sessions, answer timed questions, and compete on leaderboards. Implements Hub Contract v1.3. 
    Every error answers { "error": { "code", "message" } }.

    Log in with POST /auth/login, then click Authorize and paste the token.
  contact:
    name: Kendra Shanice Tan (kendratan-dev)
servers:
  - url: /api/v1
    description: This server
tags:
  - name: Hub Contract
    description: The endpoints every game provides to the Library Game Hub
  - name: Accounts
    description: User registration, authentication, and token verification
  - name: Users
    description: User management and role administration (Admin only)
  - name: Question Sets
    description: Creation and management of trivia question sets
  - name: Questions
    description: Question bank and options management
  - name: Sessions
    description: Game lobby, join codes, and session orchestration
  - name: Gameplay
    description: Active question polling, answer submission, and real-time leaderboards
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The token from POST /auth/login
    hubKey:
      type: apiKey
      in: header
      name: X-Hub-Key
      description: The key the Library Game Hub sends
  responses:
    BadRequest:
      description: The request is malformed (a field, the URL or the JSON itself)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_FAILED
              message: title must be 3 to 150 characters long
    Unauthorized:
      description: No login, or the token is not valid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: AUTH_REQUIRED
              message: "Log in first: send the header Authorization: Bearer <token>."
    Forbidden:
      description: Logged in, but not allowed to do this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: FORBIDDEN
              message: This question set belongs to another host.
    NotFound:
      description: That thing does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Well formed and allowed, but it clashes with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    User:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        school_id:
          type: string
          example: 2099-0001
        full_name:
          type: string
          example: Kendra Shanice Tan
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - PLAYER
            - HOST
            - ADMIN
    Meta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 23
        pages:
          type: integer
          example: 3
paths:
  /health:
    get:
      tags:
        - Hub Contract
      summary: Is the API up, and can it reach the database?
      responses:
        "200":
          description: Up
          content:
            application/json:
              example:
                status: ok
                service: reach-for-the-stars-api
                version: 1.0.0
                database: up
                uptime_seconds: 42
                timestamp: 2026-11-25T02:00:00.000Z
        "503":
          description: The database cannot be reached
  /game-info:
    get:
      tags:
        - Hub Contract
      summary: What the Hub shows about this game
      responses:
        "200":
          description: The game card
          content:
            application/json:
              example:
                slug: reach-for-the-stars
                name: Reach for the Stars
                team: Group 5
                developer: kendratan-dev
                description: An interactive trivia and question-set game platform.
                min_players: 1
                max_players: 50
                version: 1.0.0
  /results:
    get:
      tags:
        - Hub Contract
      summary: Finished games, every player, and the podium (rule 7)
      security:
        - hubKey: []
      parameters:
        - name: since
          in: query
          description: Only games that ended after this date and time
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The finished games
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The X-Hub-Key header is missing or wrong
  /auth/register:
    post:
      tags:
        - Accounts
      summary: Create a PLAYER account
      description: A role in the body is ignored. Admins promote hosts with PATCH /users/{id}/role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - school_id
                - full_name
                - email
                - password
              properties:
                school_id:
                  type: string
                  example: 2099-3001
                full_name:
                  type: string
                  example: Kendra Shanice Tan
                email:
                  type: string
                  format: email
                  example: kendra@reach.test
                password:
                  type: string
                  example: Libro-2026
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: SCHOOL_ID_TAKEN or EMAIL_TAKEN
  /auth/login:
    post:
      tags:
        - Accounts
      summary: School ID and password in, a token out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - school_id
                - password
              properties:
                school_id:
                  type: string
                  example: 2099-0001
                password:
                  type: string
                  example: Aklat-Demo-2026
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.sig
                token_type: Bearer
                expires_in: 1h
                user:
                  user_id: 1
                  school_id: 2099-0001
                  full_name: Kendra Shanice Tan
                  email: kendra@reach.test
                  role: HOST
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: INVALID_CREDENTIALS
  /auth/me:
    get:
      tags:
        - Accounts
      summary: The account of the token
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    get:
      tags:
        - Users
      summary: List all users (Admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/{id}/role:
    patch:
      tags:
        - Users
      summary: Update user role (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role updated successfully
        "401":
          $ref: "#/components/responses/Unauthorized"

  /question-sets:
    get:
      tags:
        - Question Sets
      summary: List paginated question sets
      responses:
        "200":
          description: Paginated question sets list
    post:
      tags:
        - Question Sets
      summary: Create a new question set (Host / Admin)
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Created question set
        "401":
          $ref: "#/components/responses/Unauthorized"

  /question-sets/{id}:
    get:
      tags:
        - Question Sets
      summary: Get question set details with optional questions include
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Question set details
        "404":
          description: Not found

  /question-sets/{id}/questions:
    post:
      tags:
        - Questions
      summary: Add a question to a question set
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Question created
        "400":
          $ref: "#/components/responses/BadRequest"

  /sessions:
    post:
      tags:
        - Sessions
      summary: Create a new game session
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Session created
        "401":
          $ref: "#/components/responses/Unauthorized"

  /sessions/{code}:
    get:
      tags:
        - Sessions
      summary: Get session details by join code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session details
        "404":
          description: Not found
    patch:
      tags:
        - Sessions
      summary: Update session status or position (Host)
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session updated

  /sessions/{code}/players:
    post:
      tags:
        - Sessions
      summary: Join a game session as a player
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Joined successfully

  /sessions/{code}/question:
    get:
      tags:
        - Gameplay
      summary: Get the current active question for a running session
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Active question details

  /sessions/{code}/answers:
    post:
      tags:
        - Gameplay
      summary: Submit an answer for the current active question
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Answer recorded and scored
        "409":
          description: Already answered or session not running

  /sessions/{code}/leaderboard:
    get:
      tags:
        - Gameplay
      summary: Get the current leaderboard for a session
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session leaderboard rankings