$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"school_id\": \"2026-{{$randomInt}}\",\r

    \  \"full_name\": \"New Player Test\",\r

    \  \"email\": \"player{{$randomInt}}@test.test\",\r

    \  \"password\": \"Password123\"\r

    }"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 201 and password_hash is hidden\", function () {\r

      \  pm.response.to.have.status(201);\r

      \  const json = pm.response.json();\r

      \  pm.expect(json.user.role).to.eql(\"PLAYER\");\r

      \  pm.expect(json.user.password_hash).to.be.undefined;\r

      });\r

      pm.collectionVariables.set(\"newUserId\", pm.response.json().user.user_id);\r

      pm.collectionVariables.set(\"otherPlayerToken\", pm.response.json().token);"
    language: text/javascript
order: 1000
