$kind: http-request
url: "{{baseUrl}}/sessions"
method: POST
headers:
  X-Demo-User: "{{host}}"
body:
  type: json
  content: "{\r\n  \"question_set_id\": 1\r\n}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status is 201\", function () {\r

      \  pm.response.to.have.status(201);\r

      });\r

      const jsonData = pm.response.json();\r

      const dynamicCode = jsonData.data ? jsonData.data.code : jsonData.code;\r

      pm.collectionVariables.set(\"code\", dynamicCode);"
    language: text/javascript
  - type: beforeRequest
    code: "// Automatically clears the old session code right before creating a new one\r

      pm.environment.unset(\"code\");\r

      pm.collectionVariables.unset(\"code\");"
    language: text/javascript
order: 1000
